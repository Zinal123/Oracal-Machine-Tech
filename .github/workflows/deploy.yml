name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy over SSH
        run: |
          set -x
          mkdir -p ~/.ssh

          for i in 1 2 3; do
            ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts && break
            echo "ssh-keyscan attempt $i failed, retrying in 5s..."
            sleep 5
          done

          for i in 1 2 3; do
            rsync -avzr --delete --exclude=schoolgroup \
              -e "ssh -p ${{ secrets.SSH_PORT }} -o ConnectTimeout=15 -o StrictHostKeyChecking=no" \
              dist/ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}" && break
            echo "rsync attempt $i failed, retrying in 5s..."
            sleep 5
            if [ "$i" = 3 ]; then exit 1; fi
          done
